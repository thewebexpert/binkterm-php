<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0007" />
      <stop offset="50%" stop-color="#2d0512" />
      <stop offset="100%" stop-color="#0a0003" />
    </linearGradient>
    <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3333" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="50%" stop-color="#ffa751" />
      <stop offset="100%" stop-color="#d48800" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0" />
      <stop offset="50%" stop-color="#8a9ba8" />
      <stop offset="100%" stop-color="#485563" />
    </linearGradient>
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="100%" stop-color="#660000" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Bezel / Border -->
  <rect x="8" y="8" width="496" height="496" rx="28" fill="#121216" stroke="#4a1525" stroke-width="8" />
  <rect x="20" y="20" width="472" height="472" rx="20" fill="url(#bgGrad)" stroke="#801b33" stroke-width="3" />

  <!-- Torchlight Glow Background -->
  <circle cx="256" cy="230" r="180" fill="url(#torchGlow)" />

  <!-- Dungeon Stone Archway & Brick Pattern -->
  <path d="M70 420 L70 190 Q256 60 442 190 L442 420 Z" fill="#180c14" stroke="#521d2d" stroke-width="4" />
  <path d="M110 420 L110 210 Q256 100 402 210 L402 420 Z" fill="#0d0408" stroke="#38101e" stroke-width="3" />

  <!-- Iron Throne Backing -->
  <polygon points="170,390 190,180 230,130 256,110 282,130 322,180 342,390" fill="#252530" stroke="#454555" stroke-width="4" />
  <polygon points="200,380 215,190 256,135 297,190 312,380" fill="#181822" />

  <!-- Throne Spikes / Swords -->
  <line x1="170" y1="260" x2="130" y2="170" stroke="#707585" stroke-width="6" stroke-linecap="round" />
  <line x1="342" y1="260" x2="382" y2="170" stroke="#707585" stroke-width="6" stroke-linecap="round" />
  <line x1="185" y1="220" x2="155" y2="130" stroke="#8c92a4" stroke-width="5" stroke-linecap="round" />
  <line x1="327" y1="220" x2="357" y2="130" stroke="#8c92a4" stroke-width="5" stroke-linecap="round" />

  <!-- Crossed Daggers Behind Skull -->
  <g filter="url(#glow)">
    <!-- Dagger 1 (Top Left to Bottom Right) -->
    <line x1="150" y1="160" x2="360" y2="330" stroke="url(#steelGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M340 315 L365 335 L335 345 Z" fill="#c0c5d0" />
    <!-- Dagger 2 (Top Right to Bottom Left) -->
    <line x1="362" y1="160" x2="152" y2="330" stroke="url(#steelGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M172 315 L147 335 L177 345 Z" fill="#c0c5d0" />
  </g>

  <!-- Giant Crowned Skull (The Usurper) -->
  <g transform="translate(0, 5)">
    <!-- Skull Base Shape -->
    <path d="M185 240 C185 170 327 170 327 240 C327 275 305 295 295 325 L217 325 C207 295 185 275 185 240 Z" fill="#e6decb" stroke="#332219" stroke-width="5" />
    <!-- Cheekbones / Jaw -->
    <path d="M217 325 L217 355 C217 365 295 365 295 355 L295 325 Z" fill="#d4cca8" stroke="#332219" stroke-width="4" />
    
    <!-- Teeth -->
    <rect x="226" y="328" width="10" height="22" rx="2" fill="#faf5e8" stroke="#554433" stroke-width="1.5" />
    <rect x="241" y="328" width="10" height="22" rx="2" fill="#faf5e8" stroke="#554433" stroke-width="1.5" />
    <rect x="256" y="328" width="10" height="22" rx="2" fill="#faf5e8" stroke="#554433" stroke-width="1.5" />
    <rect x="271" y="328" width="10" height="22" rx="2" fill="#faf5e8" stroke="#554433" stroke-width="1.5" />

    <!-- Eye Sockets with Fiery Red Glow -->
    <ellipse cx="225" cy="245" rx="22" ry="26" fill="#120205" stroke="#3a000c" stroke-width="3" />
    <ellipse cx="287" cy="245" rx="22" ry="26" fill="#120205" stroke="#3a000c" stroke-width="3" />
    <circle cx="227" cy="247" r="9" fill="#ff0033" filter="url(#glow)" />
    <circle cx="285" cy="247" r="9" fill="#ff0033" filter="url(#glow)" />
    <circle cx="227" cy="247" r="4" fill="#ffffff" />
    <circle cx="285" cy="247" r="4" fill="#ffffff" />

    <!-- Nasal Cavity -->
    <polygon points="256,270 248,295 264,295" fill="#1a050a" />

    <!-- Ornate Royal Golden Crown with Rubies -->
    <path d="M180 190 L180 145 L215 170 L256 125 L297 170 L332 145 L332 190 Z" fill="url(#goldGrad)" stroke="#5e3e00" stroke-width="4" />
    <!-- Crown Jewels -->
    <circle cx="256" cy="165" r="7" fill="url(#bloodGrad)" stroke="#fff" stroke-width="1" />
    <circle cx="210" cy="175" r="5" fill="url(#bloodGrad)" stroke="#fff" stroke-width="1" />
    <circle cx="302" cy="175" r="5" fill="url(#bloodGrad)" stroke="#fff" stroke-width="1" />
  </g>

  <!-- Blood Drips from Banner -->
  <path d="M160 415 Q165 440 160 450 Q155 440 160 415 Z" fill="url(#bloodGrad)" />
  <path d="M350 415 Q355 445 350 460 Q345 445 350 415 Z" fill="url(#bloodGrad)" />
  <path d="M256 425 Q260 455 256 465 Q252 455 256 425 Z" fill="url(#bloodGrad)" />

  <!-- Title Banner Box -->
  <rect x="40" y="405" width="432" height="75" rx="14" fill="#120409" stroke="url(#goldGrad)" stroke-width="4" />
  <rect x="46" y="411" width="420" height="63" rx="10" fill="#22000c" />

  <!-- Main Game Title Text -->
  <text x="256" y="445" font-family="'Courier New', Courier, monospace, Impact, sans-serif" font-weight="900" font-size="34" fill="#fff5d0" text-anchor="middle" letter-spacing="3" stroke="#000" stroke-width="2" filter="url(#glow)">USURPER</text>
  <text x="256" y="468" font-family="'Courier New', Courier, monospace, sans-serif" font-weight="700" font-size="16" fill="#ff4d6d" text-anchor="middle" letter-spacing="6">★ REBORN ★</text>

  <!-- CRT Scanline Overlay -->
  <line x1="20" y1="100" x2="492" y2="100" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2" />
  <line x1="20" y1="200" x2="492" y2="200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2" />
  <line x1="20" y1="300" x2="492" y2="300" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2" />
  <line x1="20" y1="400" x2="492" y2="400" stroke="#ffffff" stroke-opacity="0.03" stroke-width="2" />
</svg>
