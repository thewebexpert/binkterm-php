<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="15" fill="url(#bg)" stroke="#312e81" stroke-width="2"/>
  <!-- Castle / Crown Ramparts -->
  <path d="M22 62 L22 38 L32 46 L50 30 L68 46 L78 38 L78 62 Z" fill="url(#gold)" stroke="#78350f" stroke-width="1.5"/>
  <!-- Jewels on Crown Points -->
  <circle cx="22" cy="36" r="3" fill="url(#crimson)"/>
  <circle cx="50" cy="28" r="3.5" fill="url(#crimson)"/>
  <circle cx="78" cy="36" r="3" fill="url(#crimson)"/>
  <!-- Swords crossed or Shield accent -->
  <path d="M35 56 L65 56" stroke="#451a03" stroke-width="2"/>
  <circle cx="50" cy="50" r="4" fill="url(#crimson)"/>
  <!-- Text -->
  <text x="50" y="78" fill="#fde68a" font-family="'Courier New', monospace" font-weight="900" font-size="11" letter-spacing="1" text-anchor="middle">IMMORTAL</text>
  <text x="50" y="90" fill="#fbbf24" font-family="'Courier New', monospace" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">BARONS</text>
</svg>
